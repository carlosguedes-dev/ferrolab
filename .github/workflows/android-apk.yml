name: Build Android APK & Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (Capacitor + Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências, validar e compilar Web App
        run: |
          npm ci
          npm run typecheck
          npm run audit:licenses
          npm test
          npm run build

      - name: Gerar projeto nativo Android (Capacitor) e aplicar ícones
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/apply-native-icons.mjs

      - name: Compilar APK Android (Gradle)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../FerroLab-Android.apk

      - name: Verificar integridade do APK gerado
        run: |
          ls -lh FerroLab-Android.apk
          test -s FerroLab-Android.apk

      - name: Upload Artifact Android (.APK)
        uses: actions/upload-artifact@v4
        with:
          name: FerroLab-Android-APK
          path: FerroLab-Android.apk

      - name: Ler versão do package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar APK no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: "FerroLab ${{ steps.pkg.outputs.tag }} — Redesign Minimal Dark + Android APK"
          body: |
            ## FerroLab ${{ steps.pkg.outputs.tag }} — Android (.APK) & Web PWA

            Nova interface redesenhada do zero com foco em clareza visual, animações fluidas (`Framer Motion`), telas separando informações sem poluição, ícone autoral metálico de alta precisão e compilação nativa Android.

            ### Como instalar no Android
            1. Baixe **`FerroLab-Android.apk`** abaixo no seu celular Android.
            2. Abra o arquivo baixado e permita instalação de fontes desconhecidas (caso o Android solicite).
            3. Pronto! O app funciona 100% offline na academia com tela sempre ativa, cronômetros e salvamento local automático.

            ### Destaques da versão ${{ steps.pkg.outputs.tag }}
            - **Modo Foco (1 estação por vez)** no treino ativo com transições deslizantes suaves e **Mapa da Sessão** em 1 toque.
            - **Evolução segmentada** em 4 telas limpas (`Força`, `Volume`, `Corpo`, `Ritmo`) e **Ajustes** organizados em 4 sub-telas dedicadas.
            - **Barra inferior flutuante** com indicador deslizante com física *spring* e **Timer flutuante circular**.
            - **Novo ícone nativo adaptativo** FerroLab (titânio escovado + Electric Volt + Kinetic Ember).
            - **Conformidade LGPD, ECA, CDC e CONFEF/CFM** + páginas de erro (`404`, `403`, `500`).
          draft: false
          prerelease: false
          make_latest: true
          files: FerroLab-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
