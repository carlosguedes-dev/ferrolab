<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Página não encontrada · FerroLab</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #080a0d;
        background-image: radial-gradient(ellipse 75% 45% at 50% 0%, rgba(255, 107, 44, 0.14), transparent 65%);
        color: #f1f5fb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: linear-gradient(165deg, #161d28, #0e1218);
        border: 1.5px solid rgba(255, 107, 44, 0.45);
        border-radius: 22px;
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      .pill {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 107, 44, 0.16);
        border: 1px solid rgba(255, 107, 44, 0.42);
        color: #ff8b57;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 14px 0 8px;
        font-size: 28px;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        color: #9aa7bc;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
        padding: 14px 18px;
        border-radius: 14px;
        background: linear-gradient(135deg, #d3ff47, #aee600);
        color: #090c06;
        font-weight: 800;
        text-decoration: none;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="pill">ERRO 404 · FERROLAB</span>
      <h1>Estação não encontrada</h1>
      <p>
        O endereço acessado não existe neste aplicativo. Seus registros de treino salvos localmente
        permanecem intactos no dispositivo.
      </p>
      <a href="./#/treino">Voltar para o FerroLab</a>
    </main>
  </body>
</html>
